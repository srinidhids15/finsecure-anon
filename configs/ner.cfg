# FinGuard NER training configuration (spaCy 3.8).
#
# Based on `spacy init config --lang en --pipeline ner --optimize efficiency`
# (CPU, no pretrained weights, no downloads). Changes from that template are
# marked "FinGuard:". Paths are filled in by `python -m finguard.ner.train`
# (or `--paths.train ... --paths.dev ...` with `spacy train`).
#
# Data rules: [paths] train = training partition only (weight updates);
# [paths] dev = validation partition only (evaluation + best-model selection).
# The internal test partition and the official test workbook are never used.

[paths]
train = null
dev = null
vectors = null
init_tok2vec = null
# FinGuard: per-step training log (JSONL) written by the logger
train_log = null

[system]
gpu_allocator = null
# FinGuard: fixed seed (finguard.config.RANDOM_SEED)
seed = 42

[nlp]
lang = "en"
pipeline = ["tok2vec", "ner"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null

[nlp.tokenizer]
# FinGuard: custom tokenizer, so training, evaluation and inference
# tokenise exactly like the converted corpora (0 misaligned gold spans).
@tokenizers = "finguard.Tokenizer.v1"

[components]

[components.tok2vec]
factory = "tok2vec"

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tok2vec.model.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = ${components.tok2vec.model.encode.width}
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE"]
rows = [5000, 1000, 2500, 2500]
include_static_vectors = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 4
window_size = 1
maxout_pieces = 3

[components.ner]
factory = "ner"
moves = null
update_with_oracle_cut_size = 100
incorrect_spans_key = null

[components.ner.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "ner"
extra_state_tokens = false
hidden_width = 64
maxout_pieces = 2
use_upper = true
nO = null

[components.ner.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "*"

[components.ner.scorer]
@scorers = "spacy.ner_scorer.v1"

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
# FinGuard: stop after `patience` steps without a better validation score,
# or after max_epochs full passes over the training partition.
patience = 2000
max_epochs = 2
max_steps = 0
eval_frequency = 500
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 1e-08
learn_rate = 0.001

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[training.logger]
# FinGuard: also write every logged step to ${paths.train_log} (JSONL)
@loggers = "spacy.ConsoleLogger.v3"
progress_bar = null
console_output = true
output_file = ${paths.train_log}

[training.score_weights]
# Best model = highest validation entity F1 (micro, exact span + label).
ents_f = 1.0
ents_p = 0.0
ents_r = 0.0
ents_per_type = null

[pretraining]

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.tokenizer]

[initialize.components]
